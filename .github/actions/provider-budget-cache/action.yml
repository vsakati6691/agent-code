name: Preserve provider request budget
description: Restore or save the credential-free UTC-day budget between serialized dashboard jobs
inputs:
  operation:
    description: restore before collection, save immediately after collection
    required: true
runs:
  using: composite
  steps:
    - id: day
      shell: bash
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
    - if: inputs.operation == 'restore'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .cache/provider-budget.sqlite3
        key: av-budget-v1-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: av-budget-v1-${{ steps.day.outputs.day }}-
    - if: inputs.operation == 'save' && hashFiles('.cache/provider-budget.sqlite3') != ''
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .cache/provider-budget.sqlite3
        key: av-budget-v1-${{ steps.day.outputs.day }}-${{ github.run_id }}-${{ github.run_attempt }}
