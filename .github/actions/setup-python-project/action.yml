name: Set up Python project
description: Shared pinned Python setup and dependency installation; permissions stay with each job.
inputs:
  python-version:
    description: Python version
    default: "3.12"
  development:
    description: Install test and lint dependencies
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
    - if: inputs.development == 'true'
      shell: bash
      run: python -m pip install -e ".[dev]"
    - if: inputs.development != 'true'
      shell: bash
      run: python -m pip install -e .
