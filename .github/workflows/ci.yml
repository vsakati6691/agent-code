name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Tests, lint and fixture site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: "3.12"
          development: "true"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Check typed safety and orchestration boundaries
        run: python -m mypy
      - name: Verify fixture determinism
        run: python -m tests.dashboard_ci determinism --root "$RUNNER_TEMP/dashboard-repeat"
      - name: Build offline fixture site
        run: python -m tests.dashboard_ci build --root "$RUNNER_TEMP/dashboard-ci"
      - name: Verify fixture snapshot integrity
        run: python -m agent_trading.dashboard verify --data "$RUNNER_TEMP/dashboard-ci/data"
      - name: Check internal HTML links and assets
        run: python -m tests.dashboard_ci check --site "$RUNNER_TEMP/dashboard-ci/site"
