# Daily investment-research dashboard -> GitHub Pages (spec SNAPSHOT_CADENCE_RULE, 2026-10-18.1).
#
# Schedule: GitHub cron is always UTC and ignores daylight saving time.
#   Monday-Friday 22:17 UTC = 18:17 EDT (Mar-Nov) / 17:17 EST (Nov-Mar): after the 16:00 ET close. A lagging
#   Cboe history file is completed only from a verified post-close quote (PRICE_BAR_RULE).
#   Tuesday-Saturday 11:17 UTC = 07:17 EDT / 06:17 EST, before the next open, is an automatic retry for the same
#   session; it does nothing when that session's snapshot already exists (snapshots are immutable).
#   Scheduled runs can start late or be skipped when GitHub is busy; use "Run workflow" to rerun.
# Holidays: the run uses the latest completed NYSE session, so a holiday run finds it stored and skips.
# Tracking and the evidence count use one snapshot per ISO week; the others are stored and shown only.
#
# Secrets (Settings > Secrets and variables > Actions), never printed:
#   SEC_USER_AGENT        required, "<name or project> <real contact email>" (SEC fair-access policy;
#                         SEC rejects users.noreply.github.com addresses)
#   ALPHAVANTAGE_API_KEY  optional, earnings dates (1 request per run)
#   FRED_API_KEY          optional, dated macro observations and Black-Scholes rate input
# Variable:
#   DASHBOARD_OPTIONS     set to "true" to collect and publish option chains (off by default: Cboe terms)
#   DASHBOARD_PUBLISH     set to "true" to deploy to Pages, after reviewing the data-source terms in
#                         docs/RESEARCH_DASHBOARD.md. Without it the site is built and checked but not published.
#
# This workflow never reads brokerage data, places orders, or sends messages.

name: research-dashboard

on:
  schedule:
    - cron: "17 22 * * 1-5"
    - cron: "17 11 * * 2-6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Collect into workflow artifacts only; no data-branch checkout/push or Pages deployment"
        type: boolean
        default: false
      as_of:
        description: "As-of session YYYY-MM-DD (blank = latest completed NYSE session)"
        required: false
        default: ""
      options:
        description: "Collect option chains (published only if DASHBOARD_OPTIONS is true)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research-dashboard
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"
  DATA_BRANCH: research-data

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          development: "true"
      - run: python -m pytest -q

  update:
    needs: test
    if: github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 240        # full run estimated at about 100 min (Cboe throttles to about 1 request/s)
    permissions:
      contents: write          # push the research-data branch (snapshots, audit log)
    outputs:
      code: ${{ steps.run.outputs.code }}
      as_of: ${{ steps.run.outputs.as_of }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          development: "false"

      - name: Check out the data branch (created on the first run)
        run: |
          git config user.name "research-dashboard[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin "$DATA_BRANCH" >/dev/null; then
            git fetch --no-tags --depth=1 origin "$DATA_BRANCH:$DATA_BRANCH"
            git worktree add research-data "$DATA_BRANCH"
          else
            git worktree add --orphan -b "$DATA_BRANCH" research-data
          fi

      - name: HTTP cache (this run's responses only)
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: .cache/http
          key: http-${{ github.run_id }}
          restore-keys: http-

      - name: Restore daily provider budget
        uses: ./.github/actions/provider-budget-cache
        with:
          operation: restore
      - name: Research run
        id: run
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AS_OF: ${{ github.event.inputs.as_of }}
          # options are off unless the owner opts in: repository variable DASHBOARD_OPTIONS=true (Cboe terms)
          OPTIONS: ${{ vars.DASHBOARD_OPTIONS == 'true' && (github.event_name == 'schedule' || github.event.inputs.options == 'true') }}
        run: |
          find .cache/http -type f -mmin +4320 -delete 2>/dev/null || true   # drop cached responses older than 3 days
          args=(run --data research-data --cache .cache/http --commit "$GITHUB_SHA")
          [ -n "$AS_OF" ] && args+=(--as-of "$AS_OF")
          [ "$OPTIONS" = "true" ] || args+=(--no-options)
          set +e
          python -m agent_trading.dashboard "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "as_of=$(python -c 'import json;print(json.load(open("research-data/status.json")).get("as_of",""))' 2>/dev/null)" >> "$GITHUB_OUTPUT"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: Save daily provider budget even after collection failure
        if: always()
        uses: ./.github/actions/provider-budget-cache
        with:
          operation: save

      - name: Verify snapshot integrity
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m agent_trading.dashboard verify --data research-data

      - name: Save snapshots and audit trail to the data branch
        run: |
          cd research-data
          git add -A
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -q -m "Research data $(date -u +%Y-%m-%dT%H:%MZ) (run ${{ github.run_id }})"
            git push origin "HEAD:$DATA_BRANCH"
          fi

      - name: Build the static site (from stored snapshots only)
        env:
          DASHBOARD_OPTIONS: ${{ vars.DASHBOARD_OPTIONS == 'true' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: >-
          python -m agent_trading.dashboard build --data research-data --out site
          --commit "$GITHUB_SHA" --data-commit "$(git -C research-data rev-parse HEAD)"

      - name: Check every production page and local link
        run: python -m tests.dashboard_ci check --site site

      - name: Summary
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          s = json.load(open("research-data/status.json"))
          print(f"### Research dashboard: {s['status']}\n\nAs of {s.get('as_of')}. {s['message']}")
          EOF

      - name: Upload the Pages artifact
        if: vars.DASHBOARD_PUBLISH == 'true' && !inputs.dry_run
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b   # v4
        with:
          path: site

  dry-run:
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run == true
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09   # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          development: "false"
      - name: Read existing public tradability verdicts into scratch storage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p scratch/data
          gh api "repos/$GITHUB_REPOSITORY/contents/robinhood_tradability.json?ref=research-data" --jq .content | base64 --decode > scratch/data/robinhood_tradability.json
      - name: Restore daily provider budget
        uses: ./.github/actions/provider-budget-cache
        with:
          operation: restore
      - name: Collect a snapshot into scratch storage
        id: collect
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          AS_OF: ${{ inputs.as_of }}
          OPTIONS: ${{ vars.DASHBOARD_OPTIONS == 'true' && inputs.options == true }}
        run: |
          args=(run --data scratch/data --cache scratch/http --commit "$GITHUB_SHA")
          [ -n "$AS_OF" ] && args+=(--as-of "$AS_OF")
          [ "$OPTIONS" = "true" ] || args+=(--no-options)
          started=$(date +%s)
          set +e
          python -m agent_trading.dashboard "${args[@]}"
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "{\"collection_seconds\":$(( $(date +%s) - started )),\"exit_code\":$code}" > scratch/runtime.json
          exit "$code"
      - name: Save daily provider budget even after collection failure
        if: always()
        uses: ./.github/actions/provider-budget-cache
        with:
          operation: save

      - name: Verify and build the dry-run snapshot
        env:
          DASHBOARD_OPTIONS: ${{ vars.DASHBOARD_OPTIONS == 'true' }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python -m agent_trading.dashboard verify --data scratch/data
          python -m agent_trading.dashboard build --data scratch/data --out site --commit "$GITHUB_SHA"
          python -m tests.dashboard_ci check --site site
      - name: Upload dry-run outputs only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: research-dry-run-${{ github.run_id }}
          path: |
            scratch/data
            scratch/runtime.json
            site
          retention-days: 14
          if-no-files-found: error

  deploy:
    needs: update
    if: vars.DASHBOARD_PUBLISH == 'true' && github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy superseded code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "main advanced; this obsolete build must not replace the current dashboard"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4

  result:
    # The stale-data site is still deployed when the run fails; this job then fails the
    # workflow so the failure is visible in the Actions tab.
    needs: [update, deploy]
    if: always() && github.ref == 'refs/heads/main' && !inputs.dry_run
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "update: ${{ needs.update.result }} (run exit code ${{ needs.update.outputs.code }}), deploy: ${{ needs.deploy.result }}"
          if [ "${{ needs.update.result }}" != "success" ] || [ "${{ needs.update.outputs.code }}" = "2" ]; then exit 1; fi
          if [ "${{ needs.deploy.result }}" = "failure" ]; then exit 1; fi
