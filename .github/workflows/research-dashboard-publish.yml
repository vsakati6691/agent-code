# Rebuild on code changes without collecting data or writing research-data.
name: research-dashboard-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-dashboard
  cancel-in-progress: false

jobs:
  build:
    if: vars.DASHBOARD_PUBLISH == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-project
        with:
          python-version: "3.12"
          development: "true"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - name: Read the existing data branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: research-data
          path: research-data
          persist-credentials: false
      - name: Verify stored data before rendering
        run: python -m agent_trading.dashboard verify --data research-data
      - name: Build from stored data without collection
        env:
          DASHBOARD_OPTIONS: ${{ vars.DASHBOARD_OPTIONS == 'true' }}
        run: >-
          python -m agent_trading.dashboard build --data research-data --out site
          --commit "$GITHUB_SHA" --data-commit "$(git -C research-data rev-parse HEAD)"
      - name: Check every production page and local link
        run: python -m tests.dashboard_ci check --site site
      - name: Confirm the data checkout was not changed
        run: test -z "$(git -C research-data status --porcelain)"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    needs: build
    if: vars.DASHBOARD_PUBLISH == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse to deploy superseded code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "main advanced; this obsolete build must not replace the current dashboard"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
