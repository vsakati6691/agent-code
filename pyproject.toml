[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-trading"
version = "0.1.0"
description = "AI-assisted trading research system (research and paper-trading only)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "requests>=2.31",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.1", "mypy==2.4.0"]

[project.scripts]
agent-trading = "agent_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Gradual coverage: enforce these validated boundaries without suppressing
# diagnostics in the rest of the project when explicitly checking all of src.
[tool.mypy]
ignore_missing_imports = true
follow_imports = "silent"
files = [
    "src/agent_trading/account.py",
    "src/agent_trading/config.py",
    "src/agent_trading/risk.py",
    "src/agent_trading/order_gate.py",
    "src/agent_trading/provider_budget.py",
    "src/agent_trading/dashboard/http.py",
    "src/agent_trading/dashboard/pipeline_context.py",
    "src/agent_trading/dashboard/pipeline_collect.py",
    "src/agent_trading/dashboard/pipeline_assemble.py",
    "src/agent_trading/dashboard/pipeline_phases.py",
    "src/agent_trading/research/tournament.py",
    "src/agent_trading/daily_report.py",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Keep long HTML/JS strings and registered prose intact; the formatter wraps code.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Constraints is a frozen dataclass, safe as a shared default.
extend-immutable-calls = ["Constraints", "agent_trading.research.engine.Constraints"]
