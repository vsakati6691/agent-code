# agent-trading configuration.
# Research and paper-trading ONLY. The loader rejects any other mode and any
# attempt to enable shorting, margin, options or crypto.

mode: paper

# Paper-trading starting equity. This is NOT read from the broker; it mirrors
# the ~$1,000 funded agent account for realistic sizing.
paper_starting_equity: 1000.0

risk:
  risk_per_trade_pct: 0.005     # 0.5% of equity at risk per trade (entry - stop)
  max_open_risk_pct: 0.015      # 1.5% aggregate planned open risk
  max_position_pct: 0.25        # no single position above 25% of equity (notional)
  atr_stop_multiple: 2.5        # initial stop = entry - 2.5 * ATR
  fractional_shares: true       # needed for meaningful sizing on a small account
  min_order_notional: 1.0       # skip "dust" positions below $1 (Robinhood fractional minimum)
  stop_risk_buffer: 0.2         # plan for stops filling 20% of the stop distance worse (gaps)
  max_correlation: 0.8          # positions this correlated share one risk budget...
  max_correlated_risk_pct: 0.01 # ...of 1% of equity ($10 on $1,000)
  correlation_lookback: 60      # trading days of daily returns
  daily_loss_limit_pct: 0.01    # $10 on $1,000: no new entries for the rest of the day
  max_drawdown_pct: 0.08        # $80 from peak: shut down new entries until reviewed
  symbol_risk_pct:              # leveraged ETFs: tighter per-trade risk ($2.50)
    TQQQ: 0.0025
    SQQQ: 0.0025
  max_holding_days:             # leveraged ETFs decay; never hold them for long
    TQQQ: 5
    SQQQ: 5
  exclusive_groups:             # never hold both sides at once
    - [TQQQ, SQQQ]
  allow_short: false
  allow_margin: false
  allow_options: false
  allow_crypto: false

costs:
  commission_per_order: 0.0     # Robinhood equities are commission-free...
  slippage_bps: 10              # ...but slippage is real: 10 bps per side
  spread_bps: 5                 # assumed full bid/ask spread; half paid per side (no historical spreads available)

data:
  provider: alphavantage
  cache_dir: data/cache
  outputsize: compact           # free keys only get "compact" (~100 bars); "full" is premium
  max_staleness_days: 4         # reject series whose last bar is >4 business days old
  min_history_bars: 90          # reject series shorter than this
  request_pause_seconds: 12.5   # spacing between API calls
  daily_request_budget: 24      # free tier is 25/day; leave one spare

evaluation:                     # chronological train / validation / untouched holdout
  train_fraction: 0.6
  validation_fraction: 0.2      # remaining 20% is the holdout; the evaluate-* commands never touch it
  min_trades: 30                # fewer trades than this => "insufficient sample" warning

regime:
  benchmark: SPY
  fast_ma: 50
  slow_ma: 200
  vol_lookback: 20
  high_vol_threshold: 0.25      # annualised 20-day realised volatility

broker:                         # read-only snapshot checks; this code never places orders
  account_last4: "8204"
  account_nickname: Agent-trading
  snapshot_max_age_hours: 24

paper:
  order_expiry_days: 3

scanner:                        # Strategy A: every current S&P 500 constituent
  index_fund: SPY               # constituents = SPY holdings (SEC fund-holdings filings)
  min_constituents: 495
  max_constituents: 510
  universe_max_age_days: 10
  min_coverage: 0.95            # report "incomplete scan" below 95% coverage
  benchmark: SPY
  min_price: 10.0
  min_avg_dollar_volume: 50000000
  max_spread_pct: 0.0025        # 0.25% quoted spread, when a live quote is available
  earnings_blackout_days: 5
  top_research: 10
  top_actionable: 3
  target_r_multiple: 2.0
  max_missing_factors_actionable: 0   # actionable picks need every factor; no reweighting
  weights:                      # one factor per idea; no double counting (see strategies/scanner.py)
    price_strength: 0.35
    volume: 0.10
    quality: 0.20
    valuation: 0.10
    risk: 0.25

desk:                           # Strategy B: focused daily desk
  symbols: [TQQQ, SQQQ, IBIT, NVDA]
  underlying: QQQ
  leveraged_long: TQQQ
  leveraged_inverse: SQQQ
  bitcoin_instrument: IBIT      # spot BTC-USD is not used (crypto stays disabled)
  nvda_benchmark: SMH
  max_vol_long: 0.25            # no TQQQ entries when QQQ 20-day vol > 25%
  max_vol_inverse: 0.30
  event_blackout_days: 1        # no leveraged entries within 1 day of high-impact US releases
  earnings_blackout_days: 5
  nasdaq_leaders: [NVDA, AAPL, MSFT, AMZN, GOOGL, META, AVGO, TSLA]

gtaa:                           # Strategy C: Faber GTAA multi-asset trend (paper)
  enabled: true
  assets: [SPY, EFA, IEF, DBC, VNQ, TLT, GLD]
  sma_months: 10                # hold an asset only while above its 10-month average

paths:
  journal_db: data/journal.db
  reports_dir: reports
  logs_dir: logs

# Default symbol list for `fetch` (Alpha Vantage fallback; the routine imports
# Robinhood bars instead). `fetch` also refreshes the earnings calendar.
# 22 symbols + 1 earnings-calendar call fits the free 25 requests/day limit.
universe:
  broad_market_etfs: [SPY, QQQ]
  sector_etfs: [SMH, XLK, IGV, XLU, XLE, XLI]
  semiconductors: [NVDA, AMD, AVGO, TSM, MU]
  ai_infrastructure: [ANET, VRT]
  cloud: [MSFT, AMZN, GOOGL, ORCL]
  power_energy: [ETN, CEG, VST]
